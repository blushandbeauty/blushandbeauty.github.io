<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product</title>
<link rel="icon" type="image/png" href="images/uploads/favicon.png">
<link rel="stylesheet" href="style.css">
<style>
  .pwrap{max-width:900px;margin:0 auto;padding:1.2rem}
  .pback{display:inline-block;margin-bottom:1rem;color:inherit;text-decoration:none;font-weight:600}
  .pbox{display:grid;gap:1.5rem}
  .ppic{background:#F7ECEE;border-radius:18px;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:260px;font-size:5rem}
  .ppic img{width:100%;height:auto;display:block}
  .pinfo h1{margin:.2rem 0 .4rem}
  .pcat{opacity:.7;margin:0}
  .pprice{font-size:1.6rem;font-weight:700;margin:.4rem 0 1rem}
  .pold{text-decoration:line-through;opacity:.55;font-weight:400;font-size:1.1rem;margin-left:.5rem}
  .poff{display:inline-block;background:#d6336c;color:#fff;font-size:.8rem;font-weight:700;padding:.15rem .55rem;border-radius:999px;margin-left:.5rem;vertical-align:middle}
  .pdesc{line-height:1.6;margin:0 0 1.2rem;white-space:pre-line}
  @media (min-width:700px){.pbox{grid-template-columns:1fr 1fr;align-items:start}}
  #more h2{margin:2.5rem 0 1rem}
  .mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}
  @media (min-width:700px){.mgrid{grid-template-columns:repeat(4,1fr)}}
  .mcard{color:inherit;text-decoration:none;display:block}
  .mpic{background:#F7ECEE;border-radius:14px;overflow:hidden;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:3rem}
  .mpic img{width:100%;height:100%;object-fit:cover;display:block}
  .mname{margin:.5rem 0 .1rem;font-weight:600}
  .mprice{margin:0;font-weight:700}
  .mprice .pold{font-size:.85rem}
  .pthumbs{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.6rem}
  .pthumbs button{width:64px;height:64px;padding:0;border:2px solid transparent;border-radius:10px;overflow:hidden;cursor:pointer;background:none}
  .pthumbs button.on{border-color:#d6336c}
  .pthumbs img{width:100%;height:100%;object-fit:cover;display:block}
  .mpic{position:relative}
</style>
</head>
<body>
<div class="pwrap">
  <a class="pback" href="index.html">← Back to shop</a>
  <div id="product" class="pbox">Loading...</div>
  <div id="more"></div>
</div>


<script src="order.js"></script>
<script>
const load = name => fetch("content/" + name + ".json").then(r => {
  if (!r.ok) throw new Error(name);
  return r.json();
});

Promise.all([load("shop"), load("products"), load("categories")]).then(([shop, prods, cats]) => {
  const box = document.getElementById("product");
  const key = new URLSearchParams(location.search).get("p");
  const p = (prods.products || []).find(x => (x.code || x.name) === key);
  if (!p) { box.textContent = "Sorry, this product was not found."; return; }

  const cur = shop.currency || "";
  const onSale = p.salePrice && p.salePrice < p.price;
  const finalPrice = onSale ? p.salePrice : p.price;
  const off = onSale ? Math.round((p.price - p.salePrice) / p.price * 100) : 0;
  const number = String(shop.whatsapp || "").replace(/\D/g, "");
  const msg = "Hi! I’d like to order the " + p.name + " (" + cur + finalPrice + ").\n" + location.href;
  const waLink = "https://wa.me/" + number + "?text=" + encodeURIComponent(msg);

  document.title = p.name + " | " + (shop.shopName || "");
  box.textContent = "";

  const photos = [p.img].concat(p.images || []).filter((u, i, arr) => u && arr.indexOf(u) === i);
  const pic = document.createElement("div");
  pic.className = "ppic";
  let mainImg = null;
  if (photos.length) { mainImg = document.createElement("img"); mainImg.src = photos[0]; mainImg.alt = p.name; pic.appendChild(mainImg); }
  else pic.textContent = p.emoji || "🎀";

  const left = document.createElement("div");
  left.appendChild(pic);
  if (photos.length > 1) {
    const thumbs = document.createElement("div"); thumbs.className = "pthumbs";
    photos.forEach((u, i) => {
      const b = document.createElement("button"); b.type = "button";
      b.setAttribute("aria-label", "Photo " + (i + 1));
      if (i === 0) b.classList.add("on");
      const t = document.createElement("img"); t.src = u; t.alt = "";
      b.appendChild(t);
      b.onclick = () => {
        mainImg.src = u;
        thumbs.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
      };
      thumbs.appendChild(b);
    });
    left.appendChild(thumbs);
  }

  const info = document.createElement("div");
  info.className = "pinfo";
  const cat = document.createElement("p"); cat.className = "pcat"; cat.textContent = p.cat || "";
  const h1 = document.createElement("h1"); h1.textContent = p.name;
  const price = document.createElement("p"); price.className = "pprice";
  price.append(cur + finalPrice);
  if (onSale) {
    const old = document.createElement("span"); old.className = "pold"; old.textContent = cur + p.price;
    const badge = document.createElement("span"); badge.className = "poff"; badge.textContent = off + "% OFF";
    price.append(old, badge);
  }
  const desc = document.createElement("p"); desc.className = "pdesc"; desc.textContent = p.desc || p.description || "";

  let btn;
  if (p.soldOut) {
    btn = document.createElement("span"); btn.className = "btn out"; btn.textContent = "Sold out";
  } else {
    btn = document.createElement("button"); btn.type = "button"; btn.className = "btn";
    btn.textContent = "Order on WhatsApp"; btn.onclick = () => openOrder(p, shop);
  }

  info.append(cat, h1, price, desc, btn);
  box.append(left, info);

  // "You may also like": up to 4 other products from the same category
  const hiddenCats = new Set((cats.categories || []).filter(c => c.hidden).map(c => c.name));
  const more = (prods.products || [])
    .filter(x => x !== p && x.cat === p.cat && !x.soldOut && !hiddenCats.has(x.cat))
    .slice(0, 4);
  if (more.length) {
    const wrap = document.getElementById("more");
    const title = document.createElement("h2"); title.textContent = "You may also like";
    const row = document.createElement("div"); row.className = "mgrid";
    more.forEach(x => {
      const a = document.createElement("a"); a.className = "mcard";
      a.href = "product.html?p=" + encodeURIComponent(x.code || x.name);
      const ph = document.createElement("div"); ph.className = "mpic";
      if (x.img) { const im = document.createElement("img"); im.src = x.img; im.alt = x.name; im.loading = "lazy"; ph.appendChild(im); }
      else ph.textContent = x.emoji || "🎀";
      const nm = document.createElement("p"); nm.className = "mname"; nm.textContent = x.name;
      const onSale = x.salePrice && x.salePrice < x.price;
      if (onSale) {
        const tag = document.createElement("span"); tag.className = "tag-off";
        tag.textContent = Math.round((x.price - x.salePrice) / x.price * 100) + "% OFF";
        ph.appendChild(tag);
      }
      const pr = document.createElement("p"); pr.className = "mprice";
      pr.append(cur + (onSale ? x.salePrice : x.price));
      if (onSale) { const old = document.createElement("span"); old.className = "pold"; old.textContent = cur + x.price; pr.append(old); }
      a.append(ph, nm, pr);
      row.appendChild(a);
    });
    wrap.append(title, row);
  }
}).catch(() => {
  document.getElementById("product").textContent = "Could not load. Please refresh the page.";
});
</script>
</body>
</html>
